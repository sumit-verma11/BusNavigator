services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: busnav-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-busnav}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-busnav}
      POSTGRES_DB: ${POSTGRES_DB:-busnav}
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-busnav} -d ${POSTGRES_DB:-busnav}']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: busnav-redis
    command: redis-server --save '' --appendonly no
    ports:
      - '${REDIS_PORT:-6379}:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: busnav-api
    profiles: ['full']
    environment:
      NODE_ENV: development
      PORT: 4000
      DATABASE_URL: postgres://${POSTGRES_USER:-busnav}:${POSTGRES_PASSWORD:-busnav}@postgres:5432/${POSTGRES_DB:-busnav}
      REDIS_URL: redis://redis:6379
      LOG_LEVEL: debug
    ports:
      - '4000:4000'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres-data:
