name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: busnav
          POSTGRES_PASSWORD: busnav
          POSTGRES_DB: busnav_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U busnav"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      NODE_ENV: test
      DATABASE_URL: postgres://busnav:busnav@localhost:5432/busnav_test
      REDIS_URL: redis://localhost:6379
      LOG_LEVEL: silent

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Moderate advisories (currently a transitive, build-time-only postcss one via
      # Next's bundled tooling) don't block the PR; high/critical do.
      - run: npm audit --audit-level=high
      - run: npm run lint
      - run: npm run format:check
      - run: npm run db:migrate
      - run: npm test
      - run: npm run build:web # a broken frontend build must fail the PR, not the deploy

  e2e:
    runs-on: ubuntu-latest
    needs: verify

    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: busnav
          POSTGRES_PASSWORD: busnav
          POSTGRES_DB: busnav_e2e
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U busnav"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      NODE_ENV: test
      PORT: 4000
      DATABASE_URL: postgres://busnav:busnav@localhost:5432/busnav_e2e
      REDIS_URL: redis://localhost:6379
      LOG_LEVEL: silent
      CORS_ORIGIN: http://localhost:3100
      NEXT_PUBLIC_API_URL: http://localhost:4000

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run db:migrate
      # Sample data, not a real feed: the e2e suite only needs stops/routes shaped
      # like Delhi to exist, not authoritative timetables (see seed-sample.js).
      - run: npm run seed:sample --workspace=@busnav/api
      - name: Start the API
        run: |
          node apps/api/src/server.js > api.log 2>&1 &
          for i in $(seq 1 30); do
            curl -sf http://localhost:4000/healthz && exit 0
            sleep 1
          done
          echo "API never became healthy" >&2
          cat api.log
          exit 1
      - run: npm run e2e --workspace=@busnav/web
      - name: API server log
        if: always()
        run: cat api.log || true
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-traces
          path: apps/web/test-results/
          retention-days: 7
