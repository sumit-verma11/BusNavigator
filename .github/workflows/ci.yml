name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: busnav
          POSTGRES_PASSWORD: busnav
          POSTGRES_DB: busnav_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U busnav"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      NODE_ENV: test
      DATABASE_URL: postgres://busnav:busnav@localhost:5432/busnav_test
      REDIS_URL: redis://localhost:6379
      LOG_LEVEL: silent

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run db:migrate
      - run: npm test
      - run: npm run build:web # a broken frontend build must fail the PR, not the deploy
